id: patrol_encounter_rate_map

metadata:
  name: Patrol Encounter Rate Map Workflow
  description: >-
    See where your patrols encounter events most often by combining patrol
    effort and patrol events from EarthRanger into a grid-based encounter
    rate heatmap.
  maintainers:
    - name: Yun Wu
      email: yun@wildlifedynamics.com
      role: owner
    - name: Alex Morling
      email: alexm@earthranger.com
      role: reviewer
  outputs:
    - name: Encounter Rate Map
      type: map
      description: >-
        An interactive dashboard map where each grid cell is colored by its
        encounter rate, with cells that received too little patrol effort
        masked in grey.
      indicators:
        - name: Encounter Rate
        - name: Events
        - name: Patrol Effort (km)
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/patrol-encounter-rate-map
  documentation: https://github.com/wildlife-dynamics/patrol-encounter-rate-map#readme
  readme: README.md
  thumbnail: resources/thumbnail.png
  keywords: [patrol, encounter, rate, map, earthranger]

requirements:
  # >=2.18.4 required: ext-custom rc25 imports the generic aggregation models
  # (CountAggregation/SumOfColumnAggregation + make_aggregation_json_schema_extra)
  # from ecoscope.platform.tasks.analysis._patrol_summary, added in 2.18.4.
  - name: "ecoscope-platform"
    version: ">=2.23.0, <2.24.0"
    channel: "https://repo.prefix.dev/ecoscope-workflows/"
  - name: ecoscope-workflows-ext-custom
    version: "0.1.1"
    channel: "https://repo.prefix.dev/ecoscope-workflows-custom/"
  # ecoscope-platform >=2.11.18 requires pydeck ==0.9.2, but the custom channel
  # ships a forked pydeck 0.0.2 that wins under strict channel priority; pin
  # pydeck to conda-forge explicitly (same pattern as wt-download-patrols).
  - name: pydeck
    version: "0.9.2"
    channel: conda-forge

rjsf-overrides:
  properties:
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.patrol_types.description: >-
      Specify the patrol type(s) to analyze. Enter the "Patrol Types" value for each patrol type — one per field (e.g. "ecoscope_patrol"). Leave empty to include all patrol types.
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.patrol_types.default: []
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.event_types.description: >-
      Specify the event type(s) to include. Enter the "Event Types" value for each event type — one per field (e.g. "wildlife_sighting_rep"). Leave empty to include all event types.
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.event_types.default: []
    Patrol and Event Types.properties.er_patrol_and_events_params.properties.status.default: ["done"]
    # --- Filter Data: combined filter card (obs + events + trajectory) ---
    Filter Data.properties.patrol_filters.title: ""
    Filter Data.properties.patrol_filters.properties.bounding_box.description: >-
      Only include patrol observations and events whose coordinates fall
      inside this bounding box.
    Filter Data.properties.patrol_filters.properties.filter_point_coords.description: >-
      Exclude observations and events recorded at these exact coordinates
      (e.g. known bad GPS fixes).
    Filter Data.properties.patrol_filters.properties.trajectory_segment_filter.description: >-
      Drop trajectory segments outside these length / time / speed bounds
      (e.g. to remove implausible jumps).
    Group Data.properties.groupers.title: ""
    Group Data.properties.groupers.properties.groupers.description: ""
    Group Data.properties.groupers.properties.groupers.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client_name.properties.data_source.properties.name
    Group Data.properties.groupers.properties.groupers.items.anyOf:
      - {"$ref": "#/$defs/ValueGrouper"}
      - {"$ref": "#/$defs/TemporalGrouper"}
      - {"$ref": "#/$defs/SpatialGrouper"}
    # All Encounter Rate Map field titles/descriptions — including the
    # Rate Based On allOf/if/then aggregation control (value-retaining,
    # event-relevant wording) — live on set_encounter_rate_map_options
    # itself (ext-custom, via the platform's
    # make_aggregation_json_schema_extra factory).
    Encounter Rate Map.properties.map_options.title: ""
  $defs:
    ValueGrouper:
      title: "Category"
      type: "object"
      properties:
        index_name:
          title: "Index Name"
          type: "string"
          oneOf:
            - const: "event_type"
              title: "Event Type"
            - const: "patrol_type"
              title: "Patrol Type"
            - const: "patrol_subject"
              title: "Patrol Subject"
  uiSchema:
    Filter Data.patrol_filters.filter_point_coords.items.ui:options.label: false
    Encounter Rate Map.map_options.base_maps.items.ui:options.label: false
    Encounter Rate Map.map_options.aggregation:
      count_or_sum:
        ui:help: Number of Events counts events per grid cell; Sum of an Event Field totals a chosen event details field (for example Number of Animals) instead.
    Encounter Rate Map.map_options.auto_scale_or_custom_cell_size:
      anyOf:
        - ui:help: Auto-scale for an optimized grid cell size based on the workflow data or Customize to set a specific grid cell size.
          ui:options:
            label: false
          auto_scale_or_custom:
            ui:widget: hidden
        - ui:options:
            label: false
          auto_scale_or_custom:
            ui:widget: hidden
      auto_scale_or_custom:
        ui:widget: hidden

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # ── Setup ──
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  # ── Fetch (single patrol call → two extractions) ──
  - title: Patrol and Event Types
    type: task-group
    description: " "
    tasks:
      - id: er_patrol_and_events_params
        task: set_patrols_and_patrol_events_params
        partial:
          client: ${{ workflow.er_client_name.return }}
          time_range: ${{ workflow.time_range.return }}
          include_patrol_details: true
          raise_on_empty: false
          truncate_to_time_range: true
          sub_page_size: 100
          patrols_overlap_daterange: true
          include_null_geometry: false
      - id: prefetch_patrols
        task: get_patrols_from_combined_params
        partial:
          combined_params: ${{ workflow.er_patrol_and_events_params.return }}
      - id: patrol_obs
        task: get_patrol_observations_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_patrol_and_events_params.return }}
      - id: patrol_events
        task: unpack_events_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_patrol_and_events_params.return }}
      - id: event_type_display_names
        task: get_event_type_display_names_from_events
        partial:
          client: ${{ workflow.er_client_name.return }}
          events_gdf: ${{ workflow.patrol_events.return }}
          append_category_names: "duplicates"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Convert Patrol Observations to Timezone
    id: convert_patrols_to_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.patrol_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["fixtime"]

  - name: Convert Patrol Events to Timezone
    id: convert_events_to_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.event_type_display_names.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["time"]

  # ── Filter Data (combined card, patrol-effort-table pattern) ──
  - title: Filter Data
    type: task-group
    description: " "
    tasks:
      # Fully qualified: ecoscope-platform 2.17 upstreamed these config tasks
      # (verbatim) from ext-custom, so the bare names are now ambiguous.
      - name: Filters
        id: patrol_filters
        task: ecoscope.platform.tasks.config.set_traj_filters

  # Split the combined filter config into the pieces each consumer needs.
  - name: Split Bounding Box
    id: bounding_box
    task: ecoscope.platform.tasks.config.get_bounding_box
    partial:
      filters: ${{ workflow.patrol_filters.return }}

  - name: Split Point Coordinates
    id: filter_point_coords
    task: ecoscope.platform.tasks.config.get_filter_point_coords
    partial:
      filters: ${{ workflow.patrol_filters.return }}

  - name: Split Segment Filter
    id: segment_filter
    task: ecoscope.platform.tasks.config.get_segment_filter
    partial:
      filters: ${{ workflow.patrol_filters.return }}

  # ── Group Data ──
  - title: Group Data
    type: task-group
    description: >-
      Configure how data is grouped (by category, temporal index or spatial
      feature group) and split into per-group dashboard views.
    tasks:
      - name: Group Data
        id: groupers
        task: set_groupers

  # Spatial groupers: fetch the selected spatial feature groups from ER
  # and resolve them onto the grouper specs (patrol-event-sum-map pattern).
  # Invisible — no user-facing fields. All downstream grouper consumers use
  # resolved_groupers, never groupers directly.
  - task: extract_spatial_grouper_feature_group_names
    id: spatial_group_ids
    partial:
      groupers: ${{ workflow.groupers.return }}

  - task: get_spatial_features_group
    id: fetch_all_spatial_feature_groups
    partial:
      client: ${{ workflow.er_client_name.return }}
    map:
      argnames: spatial_features_group_name
      argvalues: ${{ workflow.spatial_group_ids.return }}

  - task: resolve_spatial_feature_groups_for_spatial_groupers
    id: resolved_groupers
    skipif:
      conditions:
        - never
    partial:
      groupers: ${{ workflow.groupers.return }}
      spatial_feature_groups: ${{ workflow.fetch_all_spatial_feature_groups.return }}

  # ── Process Patrol Observations → Trajectories ──
  - title: Process Patrol Observations
    type: task-group
    description: >-
      Process patrol observations into trajectories.
    tasks:
      - name: Remove Column Prefix (Observations)
        id: drop_extra_prefix_obs
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_patrols_to_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      # Coordinate/bounding-box filter from the Filter Data card.
      - name: Filter Observation Relocations
        id: filter_patrol_obs
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.drop_extra_prefix_obs.return }}
          roi_gdf: null
          roi_name: null
          reset_index: false
          bounding_box: ${{ workflow.bounding_box.return }}
          filter_point_coords: ${{ workflow.filter_point_coords.return }}

      # Trajectory segment filter from the same Filter Data card.
      - name: Trajectory Segment Filter
        id: patrol_traj
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.filter_patrol_obs.return }}
          trajectory_segment_filter: ${{ workflow.segment_filter.return }}

      - name: Remove Column Prefix (Trajectories)
        id: drop_extra_prefix_traj
        task: drop_column_prefix
        partial:
          df: ${{ workflow.patrol_traj.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Internally Process Columns
        id: customize_columns
        task: map_columns
        partial:
          df: ${{ workflow.drop_extra_prefix_traj.return }}
          rename_columns: {}
          drop_columns: ["id"]
          retain_columns: []
          raise_if_not_found: false
          duplicate_strategy: "suffix"

      - name: Add temporal index to Patrol Trajectories
        id: traj_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.customize_columns.return }}
          time_col: "segment_start"
          groupers: ${{ workflow.resolved_groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Rename value grouper columns for Trajectories
        id: traj_rename_grouper_cols
        task: map_columns
        partial:
          df: ${{ workflow.traj_add_temporal_index.return }}
          drop_columns: ["patrol_type"]
          retain_columns: []
          raise_if_not_found: false
          rename_columns:
            patrol_type__value: "patrol_type"
          duplicate_strategy: "suffix"

      - name: Add spatial index to Patrol Trajectories
        id: traj_add_spatial_index
        task: add_spatial_index
        partial:
          gdf: ${{ workflow.traj_rename_grouper_cols.return }}
          groupers: ${{ workflow.resolved_groupers.return }}

  # ── Process Patrol Events ──
  - title: Process Patrol Events
    type: task-group
    description: >-
      Process patrol events by applying filters and indexing.
    tasks:
      - name: Remove Column Prefix (Events)
        id: drop_extra_prefix_events
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_events_to_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      # Details chain (patrol-event-sum-map pattern): resolve event_details
      # against the ER event-type schemas (keys -> display titles, enums ->
      # labels), then flatten into top-level columns so the user-chosen
      # Aggregate Column is addressable by the display title shown in
      # EarthRanger. Invisible — no user-facing fields.
      #
      # SIDE BRANCH, not part of the main events chain: under --mock-io the
      # io-tagged process_events_details is replaced by a magicmock returning
      # a canned events df with no patrol columns, so passing its output
      # downstream would break patrol_id/patrol_start_time consumers. The
      # chosen aggregate column is instead merged back per group by event id
      # (details_agg_subset / pe_groups_with_agg in the Encounter Rate Map
      # group).
      - name: Process Event Details
        id: process_event_details
        task: process_events_details
        partial:
          df: ${{ workflow.drop_extra_prefix_events.return }}
          client: ${{ workflow.er_client_name.return }}
          map_to_titles: true
          ordered: true

      - name: Normalize Event Details
        id: normalize_event_details
        task: normalize_json_column
        partial:
          df: ${{ workflow.process_event_details.return }}
          column: event_details
          skip_if_not_exists: true
          sort_columns: false

      # Collision-safe prefix removal: a details field that shadows a core
      # column (e.g. "time") gets a _1 suffix instead of silently duplicating.
      - name: Remove Event Details Prefix
        id: drop_event_details_prefix
        task: drop_column_prefix
        partial:
          df: ${{ workflow.normalize_event_details.return }}
          prefix: event_details__
          duplicate_strategy: suffix

      # Coordinate/bounding-box filter shared from the Filter Data card.
      - name: Apply Coordinate Filter to Patrol Events
        id: filter_patrol_events
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.drop_extra_prefix_events.return }}
          roi_gdf: null
          roi_name: null
          reset_index: true
          bounding_box: ${{ workflow.bounding_box.return }}
          filter_point_coords: ${{ workflow.filter_point_coords.return }}

      - name: Add temporal index to Patrol Events
        id: pe_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.filter_patrol_events.return }}
          time_col: "patrol_start_time"
          groupers: ${{ workflow.resolved_groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Add spatial index to Patrol Events
        id: pe_add_spatial_index
        task: add_spatial_index
        partial:
          gdf: ${{ workflow.pe_add_temporal_index.return }}
          groupers: ${{ workflow.resolved_groupers.return }}

  # ── Cast, Split, Persist ──
  - name: Cast Patrol Trajectory Columns
    id: traj_cols_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.traj_add_spatial_index.return }}
      columns: ["patrol_serial_number", "patrol_type"]

  - name: Cast Patrol Events Columns
    id: pe_cols_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.pe_add_spatial_index.return }}
      columns: ["patrol_serial_number", "patrol_type"]

  - name: Split Patrol Trajectories by Group
    id: split_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.traj_cols_to_string.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Split Patrol Events by Group
    id: split_pe_groups
    task: split_groups
    partial:
      df: ${{ workflow.pe_cols_to_string.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  # Issue: split_pe_groups only emits keys that exist in the events data,
  # so groups with patrol effort but zero events (e.g. a month with patrols
  # and no events) vanish from the events side. Reindex to the trajectory
  # key universe, filling missing keys with an empty schema-matched df.
  - name: Align Patrol Events to Trajectory Groups
    id: aligned_split_pe_groups
    task: align_keyed_iterable_to_reference
    partial:
      target: ${{ workflow.split_pe_groups.return }}
      reference: ${{ workflow.split_traj_groups.return }}

  # ── Encounter Rate Grid Map (per group) ──
  - title: Encounter Rate Map
    type: task-group
    description: >-
      These settings generate a grid-based heatmap showing encounter rate (events per unit of patrol effort in each cell).
    tasks:
      # One combined options task so the aggregation dropdown renders on top
      # and grid cell size / CRS / mask threshold / base maps share a single
      # Advanced Configurations accordion. intersecting_only is baked here.
      - name: Map Options
        id: map_options
        task: ecoscope_workflows_ext_custom.tasks.config.set_encounter_rate_map_options
        partial:
          intersecting_only: true

      # Invisible: "" in Total Events (count) mode, the chosen Aggregate
      # Column in Sum of Event Column mode.
      - name: Aggregate Column Value
        id: agg_column
        task: ecoscope_workflows_ext_custom.tasks.config.get_agg_column_from_map_options
        partial:
          options: ${{ workflow.map_options.return }}

      # Invisible: keep just event id + the chosen aggregate column from the
      # processed-details side branch. Count mode retains only "id" (the
      # empty-string column never exists; raise_if_not_found is false).
      - name: Select Aggregate Column Values
        id: details_agg_subset
        task: map_columns
        partial:
          df: ${{ workflow.drop_event_details_prefix.return }}
          rename_columns: {}
          drop_columns: []
          retain_columns:
            - "id"
            - ${{ workflow.agg_column.return }}
          raise_if_not_found: false
          duplicate_strategy: "suffix"

      # Invisible: merge the aggregate values onto each split events group by
      # event id (left join; count mode is a no-op merge on id alone).
      # skipif drops any_is_empty_df (issue #1): aligned groups with zero
      # events must pass through so the grid still renders for them.
      - name: Merge Aggregate Column into Event Groups
        id: pe_groups_with_agg
        task: merge_two_dataframes
        skipif:
          conditions:
            - any_dependency_skipped
        partial:
          right: ${{ workflow.details_agg_subset.return }}
          how: "left"
          on: "id"
          left_on: null
          right_on: null
          left_index: false
          right_index: false
          fillna_value: null
        mapvalues:
          argnames: left
          argvalues: ${{ workflow.aligned_split_pe_groups.return }}

      - name: Zip Events and Trajectories for Grid
        id: zipped_events_traj
        task: groupbykey
        skipif:
          conditions:
            - any_dependency_skipped
            - all_keyed_iterables_are_skips
          unpack_depth: 1
        partial:
          iterables:
            - ${{ workflow.pe_groups_with_agg.return }}
            - ${{ workflow.split_traj_groups.return }}

      # Invisible: base maps for the ecomap, from the combined options.
      - name: Map Base Layers
        id: base_map_defs
        task: ecoscope_workflows_ext_custom.tasks.config.get_base_maps_from_map_options
        partial:
          options: ${{ workflow.map_options.return }}

      - name: null
        id: encounter_meshgrid
        task: ecoscope_workflows_ext_custom.tasks.config.call_meshgrid_from_map_options
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          aoi: ${{ workflow.traj_cols_to_string.return }}
          options: ${{ workflow.map_options.return }}

      # Empty Aggregate Column -> sum_column "" -> the task counts events per
      # cell (optional sum mode in calculate_encounter_rate_grid itself).
      # skipif drops any_is_empty_df (issue #1): the task itself renders an
      # all-zero grid over the patrol footprint for event-less groups.
      - name: Calculate Encounter Rate per Cell
        id: encounter_rate_grid
        task: ecoscope_workflows_ext_custom.tasks.spatial_ops.calculate_encounter_rate_grid
        skipif:
          conditions:
            - any_dependency_skipped
        partial:
          meshgrid: ${{ workflow.encounter_meshgrid.return }}
          sum_column: ${{ workflow.agg_column.return }}
        mapvalues:
          argnames: feature_layers
          argvalues: ${{ workflow.zipped_events_traj.return }}

      - name: Drop Inactive Grid Cells
        id: drop_inactive_cells
        task: ecoscope_workflows_ext_custom.tasks.spatial_ops.drop_inactive_grid_cells
        partial:
          event_column: "event_count"
          patrol_effort_column: "patrol_effort_km"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.encounter_rate_grid.return }}

      - name: Fill NaN Encounter Rate With Zero
        id: fill_nan_rate
        task: fill_na
        partial:
          columns: ["density"]
          value: 0
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.drop_inactive_cells.return }}

      - name: Sort Encounter Rate Values
        id: sort_rate_values
        task: sort_values
        partial:
          column_name: "density"
          ascending: true
          na_position: "last"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.fill_nan_rate.return }}

      - name: Classify Encounter Rate Values
        id: classify_rate
        task: apply_classification
        partial:
          input_column_name: "density"
          output_column_name: "rate_bins"
          classification_options:
            scheme: "equal_interval"
            k: 10
          label_options:
            label_ranges: true
            label_decimals: 2
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.sort_rate_values.return }}

      - name: Encounter Rate Colormap
        id: rate_colormap
        task: apply_color_map
        partial:
          input_column_name: "rate_bins"
          colormap: "RdYlGn_r"
          output_column_name: "rate_colormap"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.classify_rate.return }}

      # Invisible: low-effort mask threshold from the combined options.
      - name: Mask Threshold
        id: mask_threshold
        task: ecoscope_workflows_ext_custom.tasks.config.get_mask_threshold_from_map_options
        partial:
          options: ${{ workflow.map_options.return }}

      - name: Mask Low-Effort Cells Grey
        id: mask_low_effort
        task: ecoscope_workflows_ext_custom.tasks.spatial_ops.mask_low_effort_cells
        partial:
          patrol_effort_column: "patrol_effort_km"
          color_column: "rate_colormap"
          label_column: "rate_bins"
          threshold_km: ${{ workflow.mask_threshold.return }}
          grey_color: [128, 128, 128, 255]
          grey_label: "< 200 m patrol effort"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.rate_colormap.return }}

      # Invisible: numerator label — the Aggregate Column name when one is
      # set, else "Events" (count mode).
      - name: Rate Numerator Label
        id: rate_numerator_label
        task: default_if_string_is_empty
        partial:
          value: ${{ workflow.agg_column.return }}
          default: "Events"

      # Invisible: rate column / legend title — "<label> per km".
      - name: Rate Column Label
        id: rate_col_label
        task: concat_string_vars
        partial:
          values:
            - ${{ workflow.rate_numerator_label.return }}
            - " per km"

      # event_sum only exists in sum mode, hence raise_if_not_found: false.
      # In count mode its rename target duplicates "Events", but a rename
      # whose source column is absent is a no-op.
      - id: rename_rate_col
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          rename_columns:
            density: ${{ workflow.rate_col_label.return }}
            event_count: "Events"
            event_sum: ${{ workflow.rate_numerator_label.return }}
            patrol_effort_km: "Patrol Effort (km)"
          duplicate_strategy: "suffix"
          raise_if_not_found: false
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.mask_low_effort.return }}

      - name: Create Encounter Rate Polygon Layer
        id: rate_polygon_layer
        task: create_polygon_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            fill_color_column: "rate_colormap"
            get_line_width: 0
            opacity: 0.4
          legend:
            label_column: "rate_bins"
            color_column: "rate_colormap"
          # Count mode: rate, Events, effort. Sum mode: rate, <Agg Title>
          # per-cell total, effort.
          tooltip_columns:
            - ${{ workflow.rate_col_label.return }}
            - ${{ workflow.rate_numerator_label.return }}
            - "Patrol Effort (km)"
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.rename_rate_col.return }}

      - name: "Set Rate Map Title"
        id: set_rate_map_title
        task: set_string_var
        partial:
          var: "Encounter Rate Map"

      - name: Draw Encounter Rate Ecomap
        id: rate_ecomap
        task: draw_ecomap
        partial:
          title: null
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: ${{ workflow.rate_col_label.return }}
            format_title: false
            placement: "bottom-right"
          static: false
          max_zoom: 20
          widget_id: ${{ workflow.set_rate_map_title.return }}
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.rate_polygon_layer.return }}

      - name: Persist Encounter Rate Ecomap
        id: rate_ecomap_html_urls
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "encounter_rate_map"
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.rate_ecomap.return }}

      - name: Create Encounter Rate Map Widget
        id: rate_map_widgets
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_rate_map_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.rate_ecomap_html_urls.return }}

      - name: Merge Rate Map Widget Views
        id: grouped_rate_map_widget
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.rate_map_widgets.return }}

  # ── Dashboard ──
  # Single widget: Encounter Rate Grid Map (full width)
  - name: Create Dashboard
    id: encounter_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.grouped_rate_map_widget.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
      time_range: ${{ workflow.time_range.return }}
